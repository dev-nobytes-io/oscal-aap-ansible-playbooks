---
# READ-ONLY. `win_powershell` is a permitted read-only executor, and every task
# here declares changed_when: false and check_mode: false so evidence is still
# gathered during a check run. The script emits raw state and judges nothing.

- name: Read effective application control state (AppLocker and WDAC)
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path ~ '/files/Get-ApplicationControlState.ps1') }}"
  register: collect_windows_appcontrol_state
  changed_when: false
  check_mode: false

- name: Record application control facts into this host's bundle
  ansible.builtin.include_role:
    name: nobytes.compliance.fact_bundle
    tasks_from: record
  vars:
    _cca_ac: "{{ (collect_windows_appcontrol_state.output | default([{}]))[0] | default({}) }}"
    fact_records:
      windows.appcontrol.state:
        source: "Get-AppLockerPolicy -Effective + Win32_DeviceGuard"
        # Neither source being readable is a partial read, not an absence of
        # application control: the evaluator must report unassessed rather
        # than inventing a verdict about a host it could not inspect.
        partial: >-
          {{ not (_cca_ac.applocker.available | default(false))
             and not (_cca_ac.wdac.available | default(false)) }}
        value: "{{ _cca_ac }}"
