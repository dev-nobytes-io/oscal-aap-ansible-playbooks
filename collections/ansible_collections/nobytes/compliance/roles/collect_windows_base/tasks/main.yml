---
# READ-ONLY.
#
# Every task below ends its script with `ConvertTo-Json`, so what
# `win_powershell` returns in `output[0]` is JSON TEXT, not a mapping --
# win_powershell passes strings through unchanged. The
# `nobytes.compliance.ps_object` filter is the single place that parses it and
# reports whether a usable object came back. See ADR 0017.

- name: Enumerate Windows optional features
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $features = @()
      $err = ''
      try {
        $features = @(Get-WindowsOptionalFeature -Online |
          Select-Object @{n='name';e={$_.FeatureName}}, @{n='state';e={"$($_.State)"}})
      } catch {
        # Server SKUs without the DISM cmdlets, and non-elevated sessions
        # (Get-WindowsOptionalFeature -Online requires elevation), both land
        # here. Record WHY: an empty list that means "could not ask" must not
        # be reported as "asked, and there are none".
        $err = $_.Exception.Message
      }
      [ordered]@{
        features         = $features
        collection_error = $err
      } | ConvertTo-Json -Depth 4 -Compress
  register: collect_windows_base_features
  changed_when: false
  check_mode: false

- name: Read Internet Explorer policy state
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $out = @{}
      $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Main'
      if (Test-Path $p) {
        $k = Get-Item $p
        $out['NotifyDisableIEOptions'] = $k.GetValue('NotifyDisableIEOptions', $null)
      }
      $edge = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
      if (Test-Path $edge) {
        $k = Get-Item $edge
        $out['InternetExplorerIntegrationLevel'] = $k.GetValue('InternetExplorerIntegrationLevel', $null)
      }
      $out | ConvertTo-Json -Depth 4 -Compress
  register: collect_windows_base_ie_policy
  changed_when: false
  check_mode: false

- name: Read the Windows release identity
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $cv = Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion'
      # DisplayVersion is the release ID on modern builds (22H2); ReleaseId on
      # older ones. Edition matters: Windows 11 Enterprise and Pro have support
      # dates a full year apart, so it is reported rather than assumed.
      [pscustomobject]@{
        product_name    = $cv.ProductName
        display_version = $cv.DisplayVersion
        release_id      = $cv.ReleaseId
        current_build   = $cv.CurrentBuild
        edition_id      = $cv.EditionID
        install_type    = $cv.InstallationType
      } | ConvertTo-Json -Depth 3 -Compress
  register: collect_windows_base_release
  changed_when: false
  check_mode: false

- name: Record baseline Windows facts into this host's bundle
  ansible.builtin.include_role:
    name: nobytes.compliance.fact_bundle
    tasks_from: record
  vars:
    _cca_release_out: >-
      {{ collect_windows_base_release.output | nobytes.compliance.ps_object }}
    _cca_features_out: >-
      {{ collect_windows_base_features.output | nobytes.compliance.ps_object }}
    _cca_ie_out: >-
      {{ collect_windows_base_ie_policy.output | nobytes.compliance.ps_object }}
    _cca_win: "{{ _cca_release_out.value }}"
    # Raw identity only. Deriving the end-of-life lookup key is interpretation,
    # so it lives in the evaluator where it is unit-testable -- not here.
    _cca_windows_release:
      product_name: "{{ _cca_win.get('product_name', '') }}"
      display_version: "{{ _cca_win.get('display_version', '') or _cca_win.get('release_id', '') }}"
      current_build: "{{ _cca_win.get('current_build', '') }}"
      edition_id: "{{ _cca_win.get('edition_id', '') }}"
      install_type: "{{ _cca_win.get('install_type', '') }}"
      eol_product: "{{ 'windows-server' if _cca_win.get('install_type', '') == 'Server' else 'windows' }}"
    fact_records:
      windows.os.optional_features:
        source: Get-WindowsOptionalFeature
        # Unusable output OR a recorded collection error are both "could not
        # ask", never "asked and found none".
        partial: >-
          {{ (not _cca_features_out.ok)
             or ((_cca_features_out.value.collection_error | default('')) | length > 0) }}
        meta:
          collection_error: >-
            {{ _cca_features_out.error
               or (_cca_features_out.value.collection_error | default('')) }}
        value: "{{ _cca_features_out.value.features | default([]) }}"
      windows.browser.ie_policy:
        source: "registry:HKLM\\SOFTWARE\\Policies\\Microsoft\\Internet Explorer"
        partial: "{{ not _cca_ie_out.ok }}"
        meta:
          collection_error: "{{ _cca_ie_out.error }}"
        value: "{{ _cca_ie_out.value }}"
      os.release:
        source: "registry:HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion"
        partial: "{{ not _cca_release_out.ok }}"
        meta:
          collection_error: "{{ _cca_release_out.error }}"
        value: "{{ _cca_windows_release }}"
