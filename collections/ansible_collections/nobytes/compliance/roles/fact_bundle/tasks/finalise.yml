---
# Write this host's bundle to the artefact store.
#
# Redaction happens HERE -- between collection and persistence. Applying it
# later would be too late: you cannot retroactively un-collect.

- name: Ensure the bundle directory exists
  ansible.builtin.file:
    path: "{{ fact_bundle_dir }}/{{ fact_bundle_run_id | replace(':', '-') }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Redact identifiers and write the fact bundle
  # Runs on the controller, not the managed node: the node never needs write
  # access to the evidence store, and collection stays strictly read-only.
  ansible.builtin.copy:
    content: "{{ _cca_bundle | to_nice_json }}"
    dest: >-
      {{ fact_bundle_dir }}/{{ fact_bundle_run_id | replace(':', '-') }}/{{
      inventory_hostname | replace('/', '_') }}.json
    mode: "0600"
  delegate_to: localhost
  vars:
    _cca_bundle:
      schema: https://nobytes.io/schema/oscal-cca/fact-bundle/1.0
      run_id: "{{ fact_bundle_run_id }}"
      collected: "{{ '%Y-%m-%dT%H:%M:%S+00:00' | ansible.builtin.strftime(ansible_date_time.epoch | int) }}"
      subject:
        asset_id: "{{ cca_asset_id | default(inventory_hostname) }}"
        description: "{{ ansible_facts.get('distribution', 'unknown') }} {{ inventory_hostname }}"
        platform_family: "{{ cca_platform_family | default('unknown') }}"
        estate_tier: "{{ estate_tier | default('current') }}"
      collector:
        collection: nobytes.compliance
        ansible_version: "{{ ansible_version.full }}"
      marking:
        system: pspf
        value: "{{ fact_bundle_marking }}"
      redaction_policy: "{{ fact_bundle_redaction_policy_version }}"
      # Redaction is APPLIED here, not merely declared. Until PR 16 this line
      # wrote the facts verbatim while the bundle stamped redaction_policy
      # above it -- a protection asserted and never performed.
      facts: >-
        {{ fact_bundle_facts | default({})
           | nobytes.compliance.redact_facts(
               keys=fact_bundle_redaction_keys,
               default=fact_bundle_redaction_default,
               salt=fact_bundle_redaction_salt) }}
