---
# READ-ONLY. This role has no mutating module surface at all, which makes
# "assessment never changes a host" visible in review rather than promised in
# a comment. The guarantee that survives adversarial review is the credential
# these tasks run under -- see docs/13-security-model.md.
#
# Both scripts end in ConvertTo-Json, so win_powershell returns their output as
# a STRING. `nobytes.compliance.ps_object` is the only thing that parses it.
# Before ADR 0017 this role tested `output | length > 0` to decide whether
# Office was installed -- which is 1 on every host, because there is always
# exactly one JSON string, even when it reads "[]".

- name: Detect Microsoft Office installations
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $found = @()
      $c2r = 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration'
      if (Test-Path $c2r) {
        $k = Get-Item $c2r
        $found += [pscustomobject]@{
          product        = $k.GetValue('ProductReleaseIds', '')
          office_version = '16.0'
          channel        = $k.GetValue('CDNBaseUrl', '')
          build          = $k.GetValue('VersionToReport', '')
        }
      }
      ,$found | ConvertTo-Json -Depth 4 -Compress
  register: collect_windows_office_install
  changed_when: false
  check_mode: false

# Parsed here rather than in the record task's vars because the next task's
# `when:` depends on it. This is a controller-side fact; it touches no host.
- name: Parse the Office installation inventory
  ansible.builtin.set_fact:
    # `expect: any` because this collector's contract is a JSON ARRAY of
    # installations -- zero of them is the legitimate "no Office" answer.
    _cca_office_install: >-
      {{ collect_windows_office_install.output
         | nobytes.compliance.ps_object(expect='any') }}

- name: Enumerate Office macro policy across machine and user scopes
  ansible.windows.win_powershell:
    parameters:
      OfficeVersions: "{{ collect_windows_office_versions }}"
      Apps: "{{ collect_windows_office_apps }}"
    script: "{{ lookup('ansible.builtin.file', role_path ~ '/files/Get-OfficeMacroPolicy.ps1') }}"
  register: collect_windows_office_macro_policy
  changed_when: false
  check_mode: false
  when: (_cca_office_install.value | default([]) | length) > 0

- name: Record Office facts into this host's bundle
  ansible.builtin.include_role:
    name: nobytes.compliance.fact_bundle
    tasks_from: record
  vars:
    _cca_macro_out: >-
      {{ collect_windows_office_macro_policy.output | default([])
         | nobytes.compliance.ps_object }}
    fact_records:
      windows.office.install:
        source: "registry:HKLM\\SOFTWARE\\Microsoft\\Office\\ClickToRun"
        # An unparseable inventory is not an absence of Office. Without this the
        # evaluator reads a one-element list holding the string "[]" as an
        # installation and never reaches not_applicable.
        partial: "{{ not _cca_office_install.ok }}"
        meta:
          collection_error: "{{ _cca_office_install.error }}"
        value: "{{ _cca_office_install.value | default([]) }}"
      windows.office.macro_policy:
        source: "registry:HKLM+HKU\\*\\SOFTWARE\\Policies\\Microsoft\\office"
        # Only meaningful where Office is actually installed: the scan is
        # skipped otherwise, and a skipped scan is not a failed one.
        partial: >-
          {{ (_cca_office_install.value | default([]) | length) > 0
             and not _cca_macro_out.ok }}
        meta: "{{ _cca_macro_out.value.meta | default({}) }}"
        value: "{{ _cca_macro_out.value.rows | default([]) }}"
