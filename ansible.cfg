# Repository-local Ansible configuration.
#
# Without this, `ansible-playbook playbooks/collect.yml` fails from a clean
# checkout with "the role 'nobytes.compliance.fact_bundle' was not found" --
# because ansible looks for collections in ~/.ansible and /usr/share, not in
# this repository. Every playbook header documents that exact command, so the
# documented invocation did not work. Found by RUNNING a playbook rather than
# linting one; neither ansible-lint nor --syntax-check executes a task, and
# neither resolves an include_role.
#
# AAP and AWX supply their own configuration and ignore this file; it exists
# for the checkout, for CI, and for anyone following the README.

[defaults]
collections_path = ./collections
roles_path = ./collections/ansible_collections/nobytes/compliance/roles
# Evidence collection must never be blocked by an interactive prompt.
host_key_checking = True
stdout_callback = default
# Assessment reads; it does not need to cache facts across runs, and a stale
# cache would be evidence from the past presented as evidence from now.
gathering = smart
fact_caching = memory

# NOT set here: [inventory] unparsed_is_failed. It was, briefly, on the
# reasoning that a typo'd inventory path silently assessing nothing is exactly
# this project's feared failure. But it makes "no inventory at all" fatal, and
# `ansible-playbook --syntax-check` legitimately runs that way -- so it broke
# ansible-lint on every playbook in the repository.
#
# The protection belongs where the scope is actually decided, and it is
# already there: evaluate.yml refuses to emit an assessment from an empty
# bundle set, and coverage_gate.yml refuses an empty scope group rather than
# reporting it as 100%. A config flag that breaks the linter to re-state a
# guarantee the playbooks already enforce is a bad trade.
