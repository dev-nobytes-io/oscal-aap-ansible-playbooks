[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobytes-cca"
version = "0.1.0"
description = "Continuous compliance assessment evaluator and OSCAL emitters for the ACSC ISM"
readme = "README.md"
license = {text = "Apache-2.0"}
# 3.9 is the floor because the evaluator must run inside ee-legacy, which pins
# ansible-core 2.16 to reach Windows Server 2012 and RHEL 7/8. See ADR 0007.
requires-python = ">=3.9"
# Runtime dependencies are the standard library plus PyYAML, which ansible-core
# itself requires and is therefore present in every execution environment by
# construction (ADR 0011). Nothing else qualifies.
dependencies = ["PyYAML>=5.1"]

[project.scripts]
cca = "nobytes_cca.cli:main"

[tool.setuptools]
package-dir = {"" = "tools"}

[tool.setuptools.packages.find]
where = ["tools"]
include = ["nobytes_cca*"]

# Python tooling configuration. This project ships no installable Python
# package yet; pyproject.toml exists to configure ruff in one place.

[tool.ruff]
target-version = "py39"      # the evaluator must run inside ee-legacy; see ADR 0007
line-length = 100
src = ["tools", "tests"]
extend-exclude = [".venv", ".ansible", "oscal/upstream", "oscal/schemas"]

[tool.ruff.lint]
# Deliberately broader than the default. This tool holds estate-wide
# credentials and writes compliance evidence, so the bandit-derived `S` rules
# and the datetime rules (`DTZ` -- naive timestamps would corrupt evidence
# expiry) earn their place.
select = [
    "E", "W",    # pycodestyle
    "E402",      # imports not at top: real, and we suppress it deliberately where a sys.path shim requires it
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # flake8-bandit
    "DTZ",       # naive datetime use
    "PTH",       # prefer pathlib
    "RET", "SIM", "C4", "ISC", "RUF",
]
ignore = [
    "S101",      # assert: fine in tests, and we gate on that below
    "E501",      # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, use fixtures, and poke at internals.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["ism_release", "oscal_validate"]

[tool.ruff.format]
quote-style = "double"
