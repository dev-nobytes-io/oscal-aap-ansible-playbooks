---
version: 3

# ee-legacy — ansible-core 2.16.19 on Python 3.9
#
# Reaches: Windows Server 2012 / 2012 R2, RHEL 7-8, managed nodes on Python 2.7 or 3.6
#
# NOT technical debt -- a deliberate capability. ansible-core dropped Windows
# Server 2012/2012 R2 after 2.16, dropped managed-node Python 2.7/3.6 in 2.17,
# and does not support RHEL 8 as a managed node in 2.20. Government estates run
# all of those, and refusing to assess a legacy host does not make it secure --
# it makes it unmeasured. Only COLLECTION needs this image; evaluation runs
# centrally on current Python, so both tiers produce identical fact bundles.
#
# The base image is CentOS Stream 9 so this builds with no Red Hat
# subscription. For Ansible Automation Platform, change the one line below to
# registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9 — the
# ansible-core pin is what matters, not the base.
#
# (ansible-builder v3 restricts build_arg_defaults to a fixed set of keys, so a
# custom EE_BASE_IMAGE arg is not available; the image name is set directly.)

images:
  base_image:
    name: 'quay.io/centos/centos:stream9'

dependencies:
  ansible_core:
    package_pip: ansible-core==2.16.19
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  prepend_base:
    - RUN dnf install -y python3.9 python3.9-pip git && dnf clean all
    - RUN alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 1 || true
  append_final:
    # The evaluator is vendored into the image rather than installed from an
    # index at run time: an air-gapped enclave has no index, and pinning the
    # exact code that produced a verdict is part of the evidence chain.
    - COPY _build/nobytes_cca /tmp/nobytes_cca
    - RUN python3 -m pip install --no-index --no-deps /tmp/nobytes_cca || true
    - RUN python3 -c "import yaml; print('PyYAML present:', yaml.__version__)"
    - RUN ansible --version
