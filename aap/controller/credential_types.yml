---
# Custom credential types. Credentials themselves are NEVER defined here --
# only the shapes they take. Secrets come from a vault or the platform's own
# credential store.
controller_credential_types:
  - name: CCA Evidence Store
    description: Object store or share the fact bundles and OSCAL output are written to.
    kind: cloud
    inputs:
      fields:
        - id: cca_bundle_endpoint
          type: string
          label: Evidence store endpoint
        - id: cca_bundle_access_key
          type: string
          label: Access key
          secret: true
        - id: cca_bundle_secret_key
          type: string
          label: Secret key
          secret: true
        - id: cca_redaction_salt
          type: string
          label: Redaction salt
          secret: true
          help_text: >-
            Salts hashed identifiers in fact bundles. Rotating it breaks
            longitudinal correlation; leaving it unset makes hashes trivially
            reversible across organisations.
      required:
        - cca_bundle_endpoint
        - cca_redaction_salt
    injectors:
      env:
        CCA_BUNDLE_ENDPOINT: "{{ cca_bundle_endpoint }}"
        CCA_BUNDLE_ACCESS_KEY: "{{ cca_bundle_access_key }}"
        CCA_BUNDLE_SECRET_KEY: "{{ cca_bundle_secret_key }}"
        CCA_REDACTION_SALT: "{{ cca_redaction_salt }}"
