    statement_sha256: ca8690c945288792ff4e9caf1012b75deafde026969b56f778141e121343f2d6
    coverage: full
    rationale: >-
      The control is a binary state and both halves are directly observable:
      whether the optional feature is present, and whether policy disables the
      IE11 application. The one residual gap is IE mode inside Microsoft Edge,
      which is a deliberately supported configuration and is reported in the
      facts rather than judged, since the control speaks to Internet Explorer 11
      as a browser rather than to the MSHTML engine.

